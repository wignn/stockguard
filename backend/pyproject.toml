[project]
name = "stokguard"
version = "0.1.0"
description = "Local inventory reconciliation API for Indonesian small businesses"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1,<2",
  "argon2-cffi>=23",
  "python-multipart>=0.0.20",
  "pillow>=11",
  "uvicorn>=0.34",
  "typer>=0.15",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.11",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
stokguard = "stokguard.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/stokguard"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.vercel]
entrypoint = "src.stokguard.main:app"